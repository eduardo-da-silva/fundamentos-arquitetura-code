[importlinter]
root_package = mini_orion

# Cada contrato abaixo e uma decisao arquitetural tomada em aula,
# transformada em verificacao. Rode com:
#
#     lint-imports
#
# A estrutura agora e por dominio, nao por camada. Sao tres modulos:
#   - compra       coordena o caso de uso "fechar pedido"
#   - pagamentos   cobra
#   - notificacoes avisa
# mais o nucleo (shared kernel: so tipos de dados).
#
# A regra honesta: `compra` PODE depender das APIs publicas de
# `pagamentos` e `notificacoes` — quem orquestra conhece o contrato de
# quem e orquestrado. Nao forcamos independencia total. O que os
# contratos garantem:
#
#   1. `pagamentos` e `notificacoes` nao se conhecem (independence).
#   2. Nenhum dos dois depende de `compra` (forbidden).
#   3. `compra` nao alcanca os internals `_*` de outro modulo
#      (forbidden). `ignore_imports` isenta UMA unica aresta legitima:
#      `notificacoes.api -> notificacoes._fila`, uma API usando o proprio
#      interno (e como `compra` chega no `_fila`, via `criar_notificador`).
#      Reach-in indireto por qualquer OUTRO caminho — em especial atraves
#      de `pagamentos.api` — continua sendo detectado.

[importlinter:contract:pagamentos-e-notificacoes-independentes]
name = Pagamentos e Notificacoes nao se conhecem
type = independence
modules =
    mini_orion.pagamentos
    mini_orion.notificacoes

[importlinter:contract:downstream-nao-importa-compra]
name = Pagamentos e Notificacoes nao dependem de Compra
type = forbidden
source_modules =
    mini_orion.pagamentos
    mini_orion.notificacoes
forbidden_modules =
    mini_orion.compra

[importlinter:contract:sem-reach-in-nos-internals]
name = Ninguem alcanca os internals de outro modulo
type = forbidden
source_modules =
    mini_orion.compra
forbidden_modules =
    mini_orion.pagamentos._provedores
    mini_orion.notificacoes._fila
ignore_imports =
    mini_orion.notificacoes.api -> mini_orion.notificacoes._fila
