[importlinter]
root_package = mini_orion

# Cada contrato abaixo e uma decisao arquitetural tomada em aula,
# transformada em verificacao. Rode com:
#
#     lint-imports
#
# A estrutura agora e por dominio, nao por camada. Sao tres modulos:
#   - compra       coordena o caso de uso "fechar pedido"
#   - pagamentos   cobra
#   - notificacoes avisa
# mais o nucleo (shared kernel: so tipos de dados).
#
# A regra honesta: `compra` PODE depender das APIs publicas de
# `pagamentos` e `notificacoes` — quem orquestra conhece o contrato de
# quem e orquestrado. Nao forcamos independencia total. O que os
# contratos garantem:
#
#   1. `pagamentos` e `notificacoes` nao se conhecem (independence).
#   2. Nenhum dos dois depende de `compra` (forbidden).
#   3. `compra` nao alcanca os internals `_*` de outro modulo
#      (forbidden). `ignore_imports` isenta UMA unica aresta legitima:
#      `notificacoes.api -> notificacoes._fila`, uma API usando o proprio
#      interno (e como `compra` chega no `_fila`, via `criar_notificador`).
#      Reach-in indireto por qualquer OUTRO caminho — em especial atraves
#      de `pagamentos.api` — continua sendo detectado.
#
# `promocoes` entra como microkernel: o nucleo (`promocoes.api`) define o
# contrato `RegraDesconto` e compoe regras registradas; as regras
# concretas moram em `promocoes._regras`. O contrato 4 proibe o unico
# sentido que quebraria a arquitetura -- nucleo importando plugin. O
# inverso (`_regras -> api`, para falar `Desconto`) e permitido.

[importlinter:contract:pagamentos-e-notificacoes-independentes]
name = Pagamentos e Notificacoes nao se conhecem
type = independence
modules =
    mini_orion.pagamentos
    mini_orion.notificacoes

[importlinter:contract:downstream-nao-importa-compra]
name = Pagamentos e Notificacoes nao dependem de Compra
type = forbidden
source_modules =
    mini_orion.pagamentos
    mini_orion.notificacoes
forbidden_modules =
    mini_orion.compra

[importlinter:contract:sem-reach-in-nos-internals]
name = Ninguem alcanca os internals de outro modulo
type = forbidden
source_modules =
    mini_orion.compra
forbidden_modules =
    mini_orion.pagamentos._provedores
    mini_orion.notificacoes._fila
ignore_imports =
    mini_orion.notificacoes.api -> mini_orion.notificacoes._fila

[importlinter:contract:nucleo-nao-conhece-plugins]
name = O nucleo de promocoes nao importa regras concretas
type = forbidden
source_modules =
    mini_orion.promocoes.api
forbidden_modules =
    mini_orion.promocoes._regras

# Estado 07: `pagamentos` passa a ser alcancado por uma rede simulada.
# `rede` e infraestrutura de comunicacao: nao pode conhecer nenhum modulo
# de dominio, ou o transporte viraria um ponto de acoplamento escondido.
[importlinter:contract:rede-nao-conhece-dominio]
name = Rede nao conhece nenhum modulo de dominio
type = forbidden
source_modules =
    mini_orion.rede
forbidden_modules =
    mini_orion.compra
    mini_orion.pagamentos
    mini_orion.notificacoes
    mini_orion.promocoes

# Estado 07, Aula 18: a fronteira de `pagamentos` agora e fisica. O lado
# que atende pela rede (`_servidor`) e processo de outro time; se `compra`
# o importasse, o teste passaria rodando o codigo do produtor dentro do
# processo do consumidor, e o acordo de formato nunca seria exercitado.
# `compra` alcanca `pagamentos` pelo contrato (`api`, `contrato`) e, em
# execucao, pelo cliente que `montagem` entrega. Indiretos tambem contam.
[importlinter:contract:compra-nao-importa-o-lado-servidor]
name = Compra nao importa o lado servidor de Pagamentos
type = forbidden
source_modules =
    mini_orion.compra
forbidden_modules =
    mini_orion.pagamentos._servidor

# Estado 08, Aula 19: `pagamentos` passa a ter dado proprio. Dois contratos
# fazem essa decisao falhar na CI se alguem a desfizer.
#
# A conciliacao cruzava cobrancas com pedidos por um join. Agora ela le
# so a copia local que `pagamentos` grava na cobranca. Se voltar a
# importar `compra`, direta ou indiretamente, o contrato quebra.
[importlinter:contract:conciliacao-nao-importa-compra]
name = A conciliacao roda sem Compra
type = forbidden
source_modules =
    mini_orion.pagamentos.conciliacao
forbidden_modules =
    mini_orion.compra

# O esquema dos dados de `pagamentos` e dele. Se `compra` lesse
# `_cobrancas`, qualquer mudanca de coluna quebraria o consumidor: o
# acoplamento por esquema que a divisao do dado devia eliminar.
[importlinter:contract:compra-nao-le-os-dados-de-pagamentos]
name = Compra nao le os dados de Pagamentos
type = forbidden
source_modules =
    mini_orion.compra
forbidden_modules =
    mini_orion.pagamentos._cobrancas
