[importlinter]
root_package = mini_orion

# Cada contrato abaixo e uma decisao arquitetural tomada em aula,
# transformada em verificacao. Rode com:
#
#     lint-imports
#
# O contrato `layers` substitui os tres contratos por-modulo do
# checkpoint anterior: agora a regra e sobre camadas, nao sobre pares de
# modulos.
#
# O que `type = layers` garante: qualquer camada pode importar as que
# estao ABAIXO dela — inclusive saltando um nivel (`apresentacao` pode
# falar direto com `dominio`) — e nenhuma camada importa uma que esta
# ACIMA. Sao camadas abertas. Restringir tambem o import que salta um
# nivel exigiria contratos `forbidden` extras, par a par; esse
# contraste e tema da aula.
#
# `infraestrutura` fica FORA da pilha `apresentacao > aplicacao >
# dominio`: so a `apresentacao` (a raiz de composicao) a alcanca, e o
# contrato `forbidden` abaixo impede `dominio` e `aplicacao` de
# importa-la.

[importlinter:contract:camadas]
name = Regra de dependencia: nenhuma camada importa uma acima
type = layers
layers =
    mini_orion.apresentacao
    mini_orion.aplicacao
    mini_orion.dominio

[importlinter:contract:dominio-nao-conhece-infra]
name = Dominio e aplicacao nao conhecem infraestrutura
type = forbidden
source_modules =
    mini_orion.dominio
    mini_orion.aplicacao
forbidden_modules =
    mini_orion.infraestrutura
